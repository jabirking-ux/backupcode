name: RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP and set password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $password = "WindowsRDP#2025" | ConvertTo-SecureString -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $password
        shell: pwsh

      - name: Install Tailscale via Chocolatey
        run: |
          Write-Host "Installing Tailscale using Chocolatey..."
          choco install tailscale -y --verbose
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Chocolatey installation failed."
            exit 1
          }
          Write-Host "✅ Chocolatey install succeeded. Waiting 10 seconds for files to settle..."
          Start-Sleep -Seconds 10
          # Verify the exe exists
          if (Test-Path "C:\Program Files\Tailscale\Tailscale.exe") {
            Write-Host "✅ Tailscale.exe found at C:\Program Files\Tailscale\"
          } else {
            Write-Host "❌ Tailscale.exe NOT found after installation."
            exit 1
          }
        shell: pwsh

      - name: Connect to Tailscale
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          # Check if auth key is set
          if (-not $env:TS_AUTH_KEY) {
            Write-Host "❌ TAILSCALE_AUTH_KEY secret is missing!"
            exit 1
          }
          Write-Host "Connecting to Tailscale network..."
          & "C:\Program Files\Tailscale\Tailscale.exe" up --authkey $env:TS_AUTH_KEY --unattended --accept-routes --accept-dns
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Tailscale connection failed. Exit code: $LASTEXITCODE"
            # Show error logs if any
            & "C:\Program Files\Tailscale\Tailscale.exe" status
            exit 1
          }
          Write-Host "✅ Tailscale connected successfully."
        shell: pwsh

      - name: Show RDP details and keep alive
        run: |
          $ts = "C:\Program Files\Tailscale\Tailscale.exe"
          # Double-check it's there
          if (-not (Test-Path $ts)) {
            Write-Host "❌ Tailscale.exe missing – cannot proceed."
            exit 1
          }
          $ip = & $ts ip -4
          $ip = $ip.Trim()
          Write-Host "=================================================="
          Write-Host "      RDP IS READY – CONNECT NOW"
          Write-Host "=================================================="
          Write-Host "IP Address : $ip"
          Write-Host "Username   : runneradmin"
          Write-Host "Password   : WindowsRDP#2025"
          Write-Host "=================================================="
          Write-Host "This session will stay alive for up to 6 hours."
          Write-Host "To stop: Cancel the workflow in GitHub Actions."
          Write-Host ""
          # Keep the job alive with a heartbeat so you can see it's running
          $counter = 0
          while ($true) {
            Start-Sleep -Seconds 60
            $counter++
            Write-Host "⏳ Session alive for $counter minutes..."
          }
        shell: pwsh
