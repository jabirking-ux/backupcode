name: RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Enable RDP and set password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          $password = "WindowsRDP#2025" | ConvertTo-SecureString -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $password
        shell: pwsh

      - name: Install Tailscale via Chocolatey
        run: |
          # Chocolatey is pre-installed on GitHub Windows runners
          choco install tailscale -y
          # Give it a moment to finish
          Start-Sleep -Seconds 5
        shell: pwsh

      - name: Connect to Tailscale network
        env:
          TS_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          # Use full path to avoid "not recognized" error
          & "C:\Program Files\Tailscale\Tailscale.exe" up --authkey $env:TS_AUTH_KEY --unattended --accept-routes --accept-dns
        shell: pwsh

      - name: Show RDP connection details
        run: |
          # Use full path to get the IP address
          $ip = & "C:\Program Files\Tailscale\Tailscale.exe" ip -4
          $ip = $ip.Trim()
          Write-Host "=================================================="
          Write-Host "      RDP IS READY – CONNECT NOW"
          Write-Host "=================================================="
          Write-Host "IP Address : $ip"
          Write-Host "Username   : runneradmin"
          Write-Host "Password   : WindowsRDP#2025"
          Write-Host "=================================================="
          Write-Host "This session will stay alive for up to 6 hours."
          Write-Host "To stop: Cancel the workflow in GitHub Actions."
          while ($true) { Start-Sleep -Seconds 60 }
        shell: pwsh
